# SonarQube scanner configuration for the self-hosted instance:
#   http://sonarqube.vtex.systems/dashboard?id=pickup-points-modal
#
# projectKey must stay equal to `sonarProjectName` in .vtex/deployment.yaml so
# the dkcicd `node-ci-v2` pipeline and any local scan report to the same project.
sonar.projectKey=pickup-points-modal
sonar.projectName=pickup-points-modal
sonar.sourceEncoding=UTF-8

# Only react/ holds analyzable source. messages/ is 30+ near-identical locale
# files and would dominate the duplication metric if scanned.
sonar.sources=react
sonar.tests=react

sonar.test.inclusions=react/**/*.test.js,react/**/*.test.jsx,react/**/*.test.ts,react/**/*.test.tsx,react/**/__tests__/**

# react/index.html is the nwb demo page served by `yarn start`, not published
# code. It accounts for 5 findings (missing lang attribute, 4 CDN links without
# subresource integrity) that describe a local dev harness, not the app.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/lib/**,**/dist/**,**/es/**,**/umd/**,react/**/__mocks__/**,react/**/__snapshots__/**,react/types/**,react/test-utils.js,react/setupTestsAfterEnv.js,react/build.config.js,react/index.html

sonar.coverage.exclusions=react/**/*.test.*,react/**/__tests__/**,react/**/__mocks__/**,react/**/__snapshots__/**,react/**/*.d.ts,react/assets/**,react/constants/**,react/index.js,react/test-utils.js,react/setupTestsAfterEnv.js,react/build.config.js

# Generated SVG icon components are near-identical boilerplate by design.
sonar.cpd.exclusions=react/assets/**

# Jest runs with rootDir=react/, so lcov `SF:` paths are relative to react/ and
# the scanner (which runs from the repo root) cannot resolve them. The
# `test:coverage` script rewrites them into lcov.sonar.info.
sonar.javascript.lcov.reportPaths=react/coverage/lcov.sonar.info
sonar.typescript.lcov.reportPaths=react/coverage/lcov.sonar.info
